name: namida_waveform
description: "Fast cross-platform audio waveform, spectrum, tempo/key, lossless checks and cover art palette extraction for Namida, using libav* through Dart FFI and native assets."
version: 2.4.1
homepage: https://github.com/namidaco/namida_waveform
repository: https://github.com/namidaco/namida_waveform
publish_to: none
topics:
  - audio
  - waveform
  - ffi
  - native-assets

environment:
  sdk: ^3.11.0
  flutter: ">=3.38.0"

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.4
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5
  flutter:
    sdk: flutter
  # -- its build hook hands over libffmpegkit, which android and ios link against
  ffmpeg_kit_extended_flutter:
    git:
      url: https://github.com/MSOB7YY/ffmpeg-kit-extended
      ref: namida
      path: flutter

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0
